<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Pinkuu Batman 🦇💖</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: rgba(255,255,255,0.15);
      padding: 35px;
      border-radius: 22px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 2.3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 30px;
      font-size: 1.05rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    .yes {
      background: #ff2e63;
      color: white;
    }

    .yes:hover {
      background: #ff0a4a;
    }

    .yes2 {
      background: white;
      color: #ff2e63;
    }

    .yes2:hover {
      background: #ffe1e8;
    }

    .gallery {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
